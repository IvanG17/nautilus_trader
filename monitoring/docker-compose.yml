version: "3.8"

services:
  # Loki - Log aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # Promtail - Log collector (tails your bot logs)
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - ../logs:/var/log/trading:ro  # Mount project logs directory
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # Grafana - Dashboards & Alerting
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=trading123
      - GF_ALERTING_ENABLED=true
      - GF_DATE_FORMATS_FULL_DATE=MMM D, YYYY h:mm:ss A
      - GF_DATE_FORMATS_INTERVAL_HOUR=MMM D h:mm A
      - GF_DATE_FORMATS_INTERVAL_DAY=MMM D
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=America/Chicago
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
