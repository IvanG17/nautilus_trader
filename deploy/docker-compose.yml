services:
  # Trading Bot
  trading-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bot
    container_name: trading-bot
    environment:
      - SCHWAB_APP_KEY=${SCHWAB_APP_KEY}
      - SCHWAB_APP_SECRET=${SCHWAB_APP_SECRET}
      - TIMEFRAME=${TIMEFRAME:-1day}
    volumes:
      - bot-logs:/app/logs
      - schwab-tokens:/root/.schwabdev
    restart: unless-stopped
    depends_on:
      - loki

  # Loki - Log aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # Promtail - Log collector
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - bot-logs:/var/log/trading:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # Grafana - Dashboards & Alerting (exposed to internet)
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_ALERTING_ENABLED=true
      - GF_SERVER_ROOT_URL=http://${DROPLET_IP}:3000
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  bot-logs:
  loki-data:
  grafana-data:
  schwab-tokens:
